# qiqi77 / Typecho 伪静态配置
# 用法：贴到站点配置的 server { } 里
# 装在子目录时，把下面每处 / 换成 /你的目录/，例如 /blog/

location / {
    try_files $uri $uri/ /index.php$uri;
}

# 关键：正则要能匹配 index.php/xxx 这种带 PATH_INFO 的路径
location ~ \.php(/|$) {
    fastcgi_pass   127.0.0.1:9000;          # Linux 可用 unix:/tmp/php-cgi.sock
                                            # Windows 版 nginx 不支持 unix socket，必须用 127.0.0.1:端口
    fastcgi_index  index.php;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    fastcgi_param  PATH_INFO $fastcgi_path_info;
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include        fastcgi_params;
}

# 可选：让 /sitemap.xml 指向 extras/sitemap.php
location = /sitemap.xml {
    rewrite ^ /sitemap.php last;
}
